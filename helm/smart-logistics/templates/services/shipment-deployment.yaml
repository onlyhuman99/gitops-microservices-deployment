
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipment-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shipment-service
  template:
    metadata:
      labels:
        app: shipment-service
    spec:
      containers:
        - name: shipment-service
          image: {{ .Values.services.shipment.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.services.shipment.port }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/{{ .Values.services.shipment.database }}"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.services.shipment.port }}
            failureThreshold: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.services.shipment.port }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.services.shipment.port }}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
