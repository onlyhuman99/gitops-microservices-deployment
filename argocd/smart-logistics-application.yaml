apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: smart-logistics
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/onlyhuman99/gitops-microservices-deployment.git
    targetRevision: week-3-gitops-argocd
    path: helm/smart-logistics

  destination:
    server: https://kubernetes.default.svc
    namespace: smart-logistics

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true