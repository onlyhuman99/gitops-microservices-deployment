
name: CI-CD Pipeline

on:
  push:
    branches:
      - week-5-monitoring-observability
    paths-ignore:
      - 'helm/smart-logistics/values.yaml'

  pull_request:
    branches:
      - week-5-monitoring-observability
    paths-ignore:
      - 'helm/smart-logistics/values.yaml'

permissions:
  contents: write
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Create service databases
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

          for db in shipment_db tracking_db warehouse_db notification_db; do
            PGPASSWORD=testpassword psql \
              -h localhost \
              -U postgres \
              -d postgres \
              -c "CREATE DATABASE $db;"
          done

      - name: Test all microservices
        run: |
          for service in shipment-service tracking-service warehouse-service notification-service; do
            echo "Testing $service"

            case "$service" in
              shipment-service) db=shipment_db ;;
              tracking-service) db=tracking_db ;;
              warehouse-service) db=warehouse_db ;;
              notification-service) db=notification_db ;;
            esac

            export SPRING_DATASOURCE_URL="jdbc:postgresql://localhost:5432/$db"
            export SPRING_DATASOURCE_USERNAME=postgres
            export SPRING_DATASOURCE_PASSWORD=testpassword

            cd "$GITHUB_WORKSPACE/$service"
            chmod +x mvnw
            ./mvnw -B clean verify
          done

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Build and push images
        if: github.event_name == 'push'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for service in shipment-service tracking-service warehouse-service notification-service; do
            echo "Building $service"

            docker buildx build \
              --push \
              --tag "ghcr.io/onlyhuman99/${service}:${IMAGE_TAG}" \
              "./$service"
          done

      - name: Update Helm image tags
        if: github.event_name == 'push'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i '/^  shipment:/,/^  tracking:/ s|image:.*|image: ghcr.io/onlyhuman99/shipment-service:'"${IMAGE_TAG}"'|' helm/smart-logistics/values.yaml

          sed -i '/^  tracking:/,/^  warehouse:/ s|image:.*|image: ghcr.io/onlyhuman99/tracking-service:'"${IMAGE_TAG}"'|' helm/smart-logistics/values.yaml

          sed -i '/^  warehouse:/,/^  notification:/ s|image:.*|image: ghcr.io/onlyhuman99/warehouse-service:'"${IMAGE_TAG}"'|' helm/smart-logistics/values.yaml

          sed -i '/^  notification:/,$ s|image:.*|image: ghcr.io/onlyhuman99/notification-service:'"${IMAGE_TAG}"'|' helm/smart-logistics/values.yaml

      - name: Commit updated Helm image tags
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/smart-logistics/values.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Update service images to ${GITHUB_SHA}"
            git push
          fi
