
name: CI-CD Pipeline

on:
  push:
    branches:
      - week-4-cicd-github-actions
    paths-ignore:
      - 'helm/smart-logistics/values.yaml'
  pull_request:
    branches:
      - week-4-cicd-github-actions
    paths-ignore:
      - 'helm/smart-logistics/values.yaml'

permissions:
  contents: write
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test all microservices
        run: |
          for service in shipment-service tracking-service warehouse-service notification-service; do
            echo "Testing $service"
            cd "$GITHUB_WORKSPACE/$service"
            chmod +x mvnw
            ./mvnw -B clean verify
          done

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Build and push images
        if: github.event_name == 'push'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for service in shipment-service tracking-service warehouse-service notification-service; do
            docker buildx build \
              --push \
              --tag "ghcr.io/onlyhuman99/${service}:${IMAGE_TAG}" \
              "./$service"
          done

      - name: Update Helm image tags
        if: github.event_name == 'push'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i '/^  shipment:/,/^  tracking:/ s|image:.*|image: ghcr.io/onlyhuman99/shipment-service:'"${IMAGE_TAG}"'|' helm/smart-logistics/values.yaml
          sed -i '/^  tracking:/,/^  warehouse:/ s|image:.*|image: ghcr.io/onlyhuman99/tracking-service:'"${IMAGE_TAG}"'|' helm/smart-logistics/values.yaml
          sed -i '/^  warehouse:/,/^  notification:/ s|image:.*|image: ghcr.io/onlyhuman99/warehouse-service:'"${IMAGE_TAG}"'|' helm/smart-logistics/values.yaml
          sed -i '/^  notification:/,$ s|image:.*|image: ghcr.io/onlyhuman99/notification-service:'"${IMAGE_TAG}"'|' helm/smart-logistics/values.yaml

      - name: Commit updated Helm image tags
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/smart-logistics/values.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Update service images to ${GITHUB_SHA}"
            git push
          fi
